<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Taco Cloud</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>

<body>

<form
    method="POST"
    th:action="@{/orders}"
    th:object="${tacoOrder}">

    <h1>Ordina le tue creazioni di taco!</h1>

    <img
        th:src="@{/images/taco.png}"
        alt="Taco Cloud">

    <h3>I tuoi tacos in questo ordine:</h3>

    <a
        id="another"
        th:href="@{/design}">
        Crea un altro taco
    </a>

    <br>

    <ul>
        <li th:each="taco : ${tacoOrder.tacos}">
            <span th:text="${taco.name}">
                Nome del taco
            </span>
        </li>
    </ul>

    <h3>Consegna i miei taco a...</h3>

    <label for="deliveryName">
        Nome:
    </label>

    <input
        id="deliveryName"
        type="text"
        th:field="*{deliveryName}">

    <br>

    <label for="deliveryStreet">
        Indirizzo:
    </label>

    <input
        id="deliveryStreet"
        type="text"
        th:field="*{deliveryStreet}">

    <br>

    <label for="deliveryCity">
        Città:
    </label>

    <input
        id="deliveryCity"
        type="text"
        th:field="*{deliveryCity}">

    <br>

    <label for="deliveryState">
        Stato:
    </label>

    <input
        id="deliveryState"
        type="text"
        th:field="*{deliveryState}">

    <br>

    <label for="deliveryZip">
        Codice postale:
    </label>

    <input
        id="deliveryZip"
        type="text"
        th:field="*{deliveryZip}">

    <br>

    <h3>Pagamento</h3>

    <label for="ccNumber">
        Numero carta di credito:
    </label>

    <input
        id="ccNumber"
        type="text"
        th:field="*{ccNumber}">
        
     <span
	    class="validationError"
	    th:if="${#fields.hasErrors('ccNumber')}"
	    th:errors="*{ccNumber}">
 	</span>

    <br>

    <label for="ccExpiration">
        Scadenza:
    </label>

    <input
        id="ccExpiration"
        type="text"
        th:field="*{ccExpiration}">
        
    <span
	    class="validationError"
	    th:if="${#fields.hasErrors('ccExpiration')}"
	    th:errors="*{ccExpiration}">
 	</span>

    <br>

    <label for="ccCVV">
        CVV:
    </label>

    <input
        id="ccCVV"
        type="text"
        th:field="*{ccCVV}">

    <br>

    <input
        type="submit"
        value="Invia ordine">

</form>

</body>
</html>
